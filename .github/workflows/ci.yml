name: CI

# Runs on pushes to main as well as PRs: GitHub only lets a PR read caches
# created on its own ref or on the base branch, so main must populate them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          # Module/build caches are managed below: setup-go's built-in cache
          # has no restore-keys fallback, so every go.sum change is a full miss.
          cache: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"

      # Module download cache, compiled package cache and golangci-lint cache.
      # restore-keys allows a stale cache to be reused incrementally when
      # go.sum changes; it is saved even if a later step fails. Restored before
      # the tool install: go install leaves read-only files in ~/go/pkg/mod,
      # which tar cannot overwrite when extracting the cache afterwards.
      - name: Restore Go build caches
        id: cache-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-build-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ steps.setup-go.outputs.go-version }}-

      # Tool binaries only change when this file (the tool list) or the Go
      # version does, so the key must not depend on go.sum. An exact hit
      # (cache-hit == 'true') is required to skip the install.
      - name: Restore Go tools
        id: cache-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Go tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@v0.52.0
          go install golang.org/x/tools/go/analysis/passes/fieldalignment/cmd/fieldalignment@v0.52.0

      - name: Save Go tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin
          key: ${{ steps.cache-tools.outputs.cache-primary-key }}

      - name: Run coverage
        run: |
          mkdir -p .test
          just cover

      - name: Run vulnerability check tools
        run: just vuln

      - name: Run lint tools
        run: just lint

      - name: Save Go build caches
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.cache-build.outputs.cache-primary-key }}
