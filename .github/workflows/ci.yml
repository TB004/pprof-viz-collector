name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.4"
          cache: true

      - name: Install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/bin

      - name: Cache Go tools
        id: cache-tools
        uses: actions/cache@v5.0.5
        with:
          path: ~/go/bin
          # The cache key includes the workflow file hash, so if you change
          # the tool list, the cache will invalidate and reinstall.
          key: ${{ runner.os }}-go-tools-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-

      - name: Install Go tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest

      - name: Run coverage
        run: |
          mkdir -p .test
          just cover

      - name: Run vulnerability check tools
        run: just vuln

      - name: Run lint tools
        run: just lint
