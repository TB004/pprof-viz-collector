name: CI

# Runs on pushes to main as well as PRs: GitHub only lets a PR read caches
# created on its own ref or on the base branch, so main must populate them.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27"
          # Module/build caches are managed below: setup-go's built-in cache
          # has no restore-keys fallback, so every go.sum change is a full miss.
          cache: false

      - name: Install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sudo bash -s -- --to /usr/bin

      # Tool binaries only change when this file (the tool list) or the Go
      # version does, so the key must not depend on go.sum. An exact hit
      # (cache-hit == 'true') is required to skip the install.
      - name: Restore Go tools
        id: cache-tools
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Go tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@latest
          go install golang.org/x/tools/go/analysis/passes/fieldalignment/cmd/fieldalignment@latest

      - name: Save Go tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/go/bin
          key: ${{ steps.cache-tools.outputs.cache-primary-key }}

      # Module download cache, compiled package cache and golangci-lint cache.
      # restore-keys allows a stale cache to be reused incrementally when
      # go.sum changes; it is saved even if a later step fails.
      - name: Restore Go build caches
        id: cache-build
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-go-build-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ steps.setup-go.outputs.go-version }}-

      - name: Run coverage
        run: |
          mkdir -p .test
          just cover

      - name: Run vulnerability check tools
        run: just vuln

      - name: Run lint tools
        run: just lint

      - name: Save Go build caches
        if: always() && steps.cache-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.cache-build.outputs.cache-primary-key }}
